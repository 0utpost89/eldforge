function buildDayExercises(dayId, equipment) {
  const owned = new Set(equipment || []);
  const allowed = (v) => !v.equipment || v.equipment === "bodyweight" || owned.has(v.equipment);
  return EX[dayId]
    .map((ex) => {
      const variants = [
        { id: ex.id, name: ex.name, videoId: ex.videoId, equipment: ex.equipment },
        ...(ex.alts || []),
      ].filter(allowed);
      if (variants.length === 0) return null;
      const [primary, ...alts] = variants;
      return { ...ex, id: primary.id, name: primary.name, videoId: primary.videoId, alts };
    })
    .filter(Boolean);
}

  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return QUOTES[dayOfYear % QUOTES.length];
}

/* SOUND — one shared AudioContext for the whole app. Browsers cap how many
   contexts can exist at once, so creating a new one per sound effect
   eventually starts silently failing after enough button presses. */
let _audioCtx = null;
function getAudioContext() {
  if (!_audioCtx) {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (_audioCtx.state === "suspended") {
    _audioCtx.resume();
  }
  return _audioCtx;
}

/* SOUND — bright high-pitched metal-on-metal clink (like dumbbell plates touching) */
function playClankSound() {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    const bufferSize = Math.floor(ctx.sampleRate * 0.012);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const master = ctx.createGain();
    master.gain.value = 0.85;
    master.connect(ctx.destination);

    // bright, high, tightly-tuned resonances — inharmonic spacing so it clinks, not chimes musically
    const partials = [
      { freq: 1900, q: 30, decay: 0.28, level: 0.5 },
      { freq: 2600, q: 34, decay: 0.24, level: 0.44 },
      { freq: 3400, q: 36, decay: 0.2, level: 0.36 },
      { freq: 4300, q: 38, decay: 0.16, level: 0.28 },
      { freq: 5600, q: 32, decay: 0.12, level: 0.2 },
      { freq: 7200, q: 28, decay: 0.08, level: 0.14 },
    ];

    partials.forEach((p) => {
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = p.freq;
      bp.Q.value = p.q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(p.level, now);
      g.gain.exponentialRampToValueAtTime(0.0005, now + p.decay);
      src.connect(bp);
      bp.connect(g);
      g.connect(master);
      src.start(now);
      src.stop(now + p.decay + 0.03);
    });

    // hairline sharp attack click to sharpen the transient
    const clickSrc = ctx.createBufferSource();
    clickSrc.buffer = buffer;
    const clickFilter = ctx.createBiquadFilter();
    clickFilter.type = "highpass";
    clickFilter.frequency.value = 6000;
    const clickGain = ctx.createGain();
    clickGain.gain.setValueAtTime(0.4, now);
    clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
    clickSrc.connect(clickFilter);
    clickFilter.connect(clickGain);
    clickGain.connect(master);
    clickSrc.start(now);
    clickSrc.stop(now + 0.02);
  } catch (e) {
    /* audio not available, fail silently */
  }
}

/* SOUND — crowd cheer swell for finishing the whole workout */
function playCheerSound() {
  try {
    const ctx = getAudioContext();
    const duration = 1.1;

    // noise burst shaped into a rising/falling "roar"
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const bandpass = ctx.createBiquadFilter();
    bandpass.type = "bandpass";
    bandpass.frequency.value = 1400;
    bandpass.Q.value = 0.6;

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, ctx.currentTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.25);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

    noise.connect(bandpass);
    bandpass.connect(noiseGain);
    noiseGain.connect(ctx.destination);

    // bright triumphant chord stab layered on top
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.1, ctx.currentTime + 0.05 + i * 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.6);
    });

    noise.start();
    noise.stop(ctx.currentTime + duration);
  } catch (e) {
    /* audio not available, fail silently */
  }
}

/* SOUND — neutral mechanical click for cycling exercise variants (deliberately
   flat/toneless — a card-flip snap, not a chime — so it doesn't read as a
   success or achievement cue like the clank/cheer sounds do) */
function playShuffleSound() {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    const bufferSize = Math.floor(ctx.sampleRate * 0.02);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    // two quick broadband taps — no pitch, no sustained ring
    [0, 0.055].forEach((offset, i) => {
      const t = now + offset;
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 2200 - i * 500;
      bp.Q.value = 3;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 0.045);
      src.connect(bp);
      bp.connect(g);
      g.connect(ctx.destination);
      src.start(t);
      src.stop(t + 0.05);
    });
  } catch (e) {
    /* audio not available, fail silently */
  }
}


/* SOUND — firm mechanical "lock-in" thunk for picking a workout on the home screen */
function playSelectSound() {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    // low thud, like a lever engaging
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.5, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.2);

    // short metallic ring on top, lower register than the set-complete clank
    const bufferSize = Math.floor(ctx.sampleRate * 0.02);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    [900, 1400, 2100].forEach((freq, i) => {
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = freq;
      bp.Q.value = 22;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.22 - i * 0.05, now);
      g.gain.exponentialRampToValueAtTime(0.0005, now + 0.16);
      src.connect(bp);
      bp.connect(g);
      g.connect(ctx.destination);
      src.start(now);
      src.stop(now + 0.18);
    });
  } catch (e) {
    /* audio not available, fail silently */
  }
}

/* SOUND — gentle two-note bell for the rest timer finishing */
function playTimerDoneSound() {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    [880, 1046.5].forEach((freq, i) => {
      const t = now + i * 0.16;
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 0.32);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.34);
    });
  } catch (e) {
    /* audio not available, fail silently */
  }
}

/* STORAGE (plain localStorage since this runs standalone, not inside Claude) */
function loadSessions() {
  try {
    const raw = localStorage.getItem("setlog_sessions");
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveSessions(list) {
  try {
    localStorage.setItem("setlog_sessions", JSON.stringify(list));
  } catch (e) {
    console.error("save failed", e);
  }
}

function loadUsername() {
  try {
    return localStorage.getItem("setlog_username") || "";
  } catch (e) {
    return "";
  }
}
function saveUsername(name) {
  try {
    localStorage.setItem("setlog_username", name);
  } catch (e) {
    console.error("save failed", e);
  }
}

function loadEquipment() {
  try {
    const raw = localStorage.getItem("setlog_equipment");
    return raw ? JSON.parse(raw) : ["dumbbells"];
  } catch (e) {
    return ["dumbbells"];
  }
}
function saveEquipment(list) {
  try {
    localStorage.setItem("setlog_equipment", JSON.stringify(list));
  } catch (e) {
    console.error("save failed", e);
  }
}

function makeDefaultSets(exercise) {
  return Array.from({ length: exercise.sets }, () =>
    exercise.type === "time"
      ? { seconds: exercise.targetSeconds, weight: "" }
      : { reps: exercise.targetReps, weight: "" }
  );
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}

/* PLATE PROGRESS BAR */
function PlateProgress({ total, current }) {
  return (
    <div style={{ display: "flex", gap: 6, width: "100%" }}>
      {Array.from({ length: total }).map((_, i) => (
        <div key={i} style={{
          height: 8, flex: 1, borderRadius: 3,
          backgroundColor: i < current ? T.accent : i === current ? T.teal : T.line,
          transition: "background-color 200ms",
        }} />
      ))}
    </div>
  );
}

/* SESSION VIEW */
function Session({ dayId, exercises, onFinish, onExit }) {
  const [idx, setIdx] = useState(0);
  const [log, setLog] = useState(() => exercises.map((ex) => makeDefaultSets(ex)));

  const [wobble, setWobble] = useState(false);
  const [variantSel, setVariantSel] = useState(() => exercises.map(() => 0));
  const exercise = exercises[idx];
  const sets = log[idx];

  const variantsFor = (ex) => [{ id: ex.id, name: ex.name, videoId: ex.videoId }, ...(ex.alts || [])];
  const variants = variantsFor(exercise);
  const currentVariant = variants[variantSel[idx] % variants.length];

  const swapExercise = () => {
    if (variants.length < 2) return;
    playShuffleSound();
    setVariantSel((prev) => {
      const copy = [...prev];
      copy[idx] = (copy[idx] + 1) % variants.length;
      return copy;
    });
  };

  const updateSet = (setI, field, value) => {
    setLog((prev) => {
      const copy = prev.map((s) => s.map((row) => ({ ...row })));
      copy[idx][setI][field] = value;
      return copy;
    });
  };

  const addSet = () => {
    setLog((prev) => {
      const copy = prev.map((s) => s.map((row) => ({ ...row })));
      copy[idx].push(
        exercise.type === "time"
          ? { seconds: exercise.targetSeconds, weight: "" }
          : { reps: exercise.targetReps, weight: "" }
      );
      return copy;
    });
  };

  const removeSet = (setI) => {
    setLog((prev) => {
      const copy = prev.map((s) => s.map((row) => ({ ...row })));
      if (copy[idx].length > 1) copy[idx].splice(setI, 1);
      return copy;
    });
  };

  const next = () => {
    const isLast = idx >= exercises.length - 1;
    if (isLast) playCheerSound();
    else playClankSound();
    setWobble(true);
    setTimeout(() => setWobble(false), 400);
    if (idx < exercises.length - 1) {
      setIdx(idx + 1);
    } else {
      const performed = exercises.map((ex, i) => {
        const v = variantsFor(ex);
        return { ...ex, name: v[variantSel[i] % v.length].name };
      });
      onFinish(dayId, performed, log);
    }
  };
  const prevExercise = () => { if (idx > 0) setIdx(idx - 1); };

  return (
    <div className={wobble ? "setlog-wobble" : ""} style={{ display: "flex", flexDirection: "column", height: "100%", backgroundColor: "transparent" }}>
      <div style={{ padding: "24px 20px 12px", display: "flex", alignItems: "center", gap: 12 }}>
        <button onClick={onExit} style={{ background: "none", border: "none", padding: 0, display: "flex" }}>
          <ArrowLeft size={20} color={T.textMute} />
        </button>
        <div style={{ flex: 1 }}><PlateProgress total={exercises.length} current={idx} /></div>
      </div>

      <div style={{ padding: "0 20px 8px" }}>
        <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, color: T.accent }}>
          {DAYS.find((d) => d.id === dayId).label} · Exercise {idx + 1} of {exercises.length}
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: 2 }}>
          <div style={{ fontSize: 20, fontWeight: 900, textTransform: "uppercase", letterSpacing: -0.3, color: T.text }}>
            {currentVariant.name}
          </div>
          {variants.length > 1 && (
            <button onClick={swapExercise} style={{
              display: "flex", alignItems: "center", gap: 5, flexShrink: 0,
              padding: "6px 10px", borderRadius: 8, fontSize: 11, fontWeight: 700,
              textTransform: "uppercase", letterSpacing: 0.5,
              backgroundColor: T.surface, border: `1px solid ${T.line}`, color: T.textMute,
            }}>
              <Shuffle size={13} />
              Swap
            </button>
          )}
        </div>
      </div>

      <div style={{ margin: "0 20px", borderRadius: 10, overflow: "hidden", backgroundColor: T.surface, border: `1px solid ${T.line}` }}>
        <div style={{ position: "relative", paddingTop: "56.25%" }}>
          <iframe
            key={currentVariant.id}
            src={`https://www.youtube.com/embed/${currentVariant.videoId}?rel=0&modestbranding=1`}
            title={currentVariant.name}
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowFullScreen
            style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", border: "none" }}
          />
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "0 20px", marginTop: 12 }}>
        <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8, color: T.textMute }}>
          Target: {exercise.sets} sets × {exercise.type === "time" ? `${exercise.targetSeconds}s` : exercise.targetReps}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {sets.map((row, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, borderRadius: 10, padding: 10, backgroundColor: T.surface, border: `1px solid ${T.line}` }}>
              <div style={{ width: 28, height: 28, borderRadius: 6, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 900, flexShrink: 0, backgroundColor: T.surfaceRaised, color: T.textMute }}>
                {i + 1}
              </div>
              <div style={{ flex: 1 }}>
                <label style={{ fontSize: 11, display: "block", marginBottom: 2, color: T.textFaint }}>
                  {exercise.type === "time" ? "Seconds" : "Reps"}
                </label>
                <input
                  type="text" inputMode="numeric"
                  value={exercise.type === "time" ? row.seconds : row.reps}
                  onChange={(e) => updateSet(i, exercise.type === "time" ? "seconds" : "reps", e.target.value)}
                  style={{ width: "100%", background: "transparent", border: "none", fontSize: 14, fontWeight: 700, color: T.text }}
                />
              </div>
              <div style={{ flex: 1 }}>
                <label style={{ fontSize: 11, display: "block", marginBottom: 2, color: T.textFaint }}>Weight (kg)</label>
                <input
                  type="text" inputMode="decimal" placeholder="0"
                  value={row.weight}
                  onChange={(e) => updateSet(i, "weight", e.target.value)}
                  style={{ width: "100%", background: "transparent", border: "none", fontSize: 14, fontWeight: 700, color: T.text }}
                />
              </div>
              <button onClick={() => removeSet(i)} style={{ background: "none", border: "none", padding: 4, flexShrink: 0, display: "flex" }}>
                <Trash2 size={15} color={T.textFaint} />
              </button>
            </div>
          ))}
        </div>
        <button onClick={addSet} style={{
          marginTop: 8, width: "100%", padding: "8px 0", borderRadius: 10,
          fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5,
          background: "none", border: `1px dashed ${T.line}`, color: T.textMute,
        }}>
          + Add set
        </button>

        <RestTimer key={idx} />
      </div>

      <div style={{ padding: "8px 20px 24px", display: "flex", gap: 8, backgroundColor: "transparent" }}>
        {idx > 0 && (
          <button onClick={prevExercise} style={{
            borderRadius: 10, padding: "0 16px", display: "flex", alignItems: "center", justifyContent: "center",
            backgroundColor: T.surface, border: `1px solid ${T.line}`,
          }}>
            <ChevronLeft size={20} color={T.textMute} />
          </button>
        )}
        <button onClick={next} style={{

/* REST TIMER — manual start only, never auto-starts between sets. Rendered
   with key={idx} from Session so it fully resets on every exercise change. */
function RestTimer() {
  const [secondsLeft, setSecondsLeft] = useState(0);
  const [running, setRunning] = useState(false);

  useEffect(() => {
    if (!running) return;
    if (secondsLeft <= 0) {
      setRunning(false);
      playTimerDoneSound();
      return;
    }
    const t = setTimeout(() => setSecondsLeft((s) => s - 1), 1000);
    return () => clearTimeout(t);
  }, [running, secondsLeft]);

  const start = (d) => {
    setSecondsLeft(d);
    setRunning(true);
  };
  const cancel = () => {
    setRunning(false);
    setSecondsLeft(0);
  };
  const addTime = () => setSecondsLeft((s) => s + 15);

  const mm = Math.floor(secondsLeft / 60);
  const ss = secondsLeft % 60;

  return (
    <div style={{ borderRadius: 10, padding: 14, backgroundColor: T.surface, border: `1px solid ${T.line}`, marginTop: 8, marginBottom: 16 }}>
      {!running ? (
        <React.Fragment>
          <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, color: T.textMute, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
            <TimerIcon size={13} />
            Rest Timer
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            {[30, 60, 90, 120].map((d) => (
              <button key={d} onClick={() => start(d)} style={{
                flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 13, fontWeight: 700,
                backgroundColor: T.surfaceRaised, border: `1px solid ${T.line}`, color: T.text,
                display: "flex", alignItems: "center", justifyContent: "center", gap: 4,
              }}>
                <PlayIcon size={11} color={T.accent} />
                {d < 60 ? `${d}s` : `${d / 60}m`}
              </button>
            ))}
          </div>
        </React.Fragment>
      ) : (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, color: T.textMute }}>Resting</div>
            <div style={{ fontSize: 28, fontWeight: 900, color: T.accent, fontVariantNumeric: "tabular-nums" }}>
              {mm}:{String(ss).padStart(2, "0")}
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={addTime} style={{
              width: 40, height: 40, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
              backgroundColor: T.surfaceRaised, border: `1px solid ${T.line}`,
            }}>
              <PlusIcon size={16} color={T.textMute} />
            </button>
            <button onClick={cancel} style={{
              width: 40, height: 40, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
              backgroundColor: T.surfaceRaised, border: `1px solid ${T.line}`,
            }}>
              <XIcon size={16} color={T.textMute} />
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* PLATE CALCULATOR — only reachable if barbell is in the user's equipment */
const STANDARD_PLATES_KG = [25, 20, 15, 10, 5, 2.5, 1.25];
function calcPlates(target, barWeight) {
  let remaining = Math.max(0, (target - barWeight) / 2);
  const breakdown = [];
  STANDARD_PLATES_KG.forEach((p) => {
    const count = Math.floor(remaining / p + 1e-9);
    if (count > 0) {
      breakdown.push({ plate: p, count });
      remaining = Math.round((remaining - count * p) * 100) / 100;
    }
  });
  return { breakdown, remainder: remaining };
}

function PlateCalculator({ onBack }) {
  const [target, setTarget] = useState("60");
  const [barWeight, setBarWeight] = useState("20");
  const targetNum = parseFloat(target) || 0;
  const barNum = parseFloat(barWeight) || 0;
  const { breakdown, remainder } = calcPlates(targetNum, barNum);
  const achieved = Math.round((barNum + breakdown.reduce((a, b) => a + b.plate * b.count, 0) * 2) * 100) / 100;

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", backgroundColor: "transparent" }}>
      <div style={{ padding: "32px 20px 16px", display: "flex", alignItems: "center", gap: 12 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", padding: 0, display: "flex" }}>
          <ArrowLeft size={20} color={T.textMute} />
        </button>
        <div style={{ fontSize: 24, fontWeight: 900, textTransform: "uppercase", letterSpacing: -0.5, color: T.text }}>Plate Calculator</div>
      </div>

      <div style={{ padding: "0 20px", display: "flex", gap: 12, marginBottom: 20 }}>
        <div style={{ flex: 1 }}>
          <label style={{ fontSize: 11, display: "block", marginBottom: 4, color: T.textFaint }}>Target weight (kg)</label>
          <input
            type="text" inputMode="decimal" value={target}
            onChange={(e) => setTarget(e.target.value)}
            style={{ width: "100%", padding: "12px 14px", borderRadius: 10, fontSize: 16, fontWeight: 700, backgroundColor: T.surface, border: `1px solid ${T.line}`, color: T.text }}
          />
        </div>
        <div style={{ flex: 1 }}>
          <label style={{ fontSize: 11, display: "block", marginBottom: 4, color: T.textFaint }}>Bar weight (kg)</label>
          <input
            type="text" inputMode="decimal" value={barWeight}
            onChange={(e) => setBarWeight(e.target.value)}
            style={{ width: "100%", padding: "12px 14px", borderRadius: 10, fontSize: 16, fontWeight: 700, backgroundColor: T.surface, border: `1px solid ${T.line}`, color: T.text }}
          />
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "0 20px" }}>
        <div style={{ borderRadius: 10, padding: 16, backgroundColor: T.surface, border: `1px solid ${T.line}`, marginBottom: 16 }}>
          <div style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: 1, color: T.textMute, marginBottom: 10 }}>Per side</div>
          {breakdown.length === 0 ? (
            <div style={{ fontSize: 14, color: T.textFaint }}>Just the bar — no plates needed.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {breakdown.map((b) => (
                <div key={b.plate} style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <div style={{
                      width: 34, height: 34, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center",
                      backgroundImage: "linear-gradient(135deg, #FF8C42, #E85A1F)", color: T.bg, fontWeight: 900, fontSize: 11,
                    }}>{b.plate}</div>
                    <div style={{ fontSize: 14, color: T.text }}>{b.plate} kg plate{b.count > 1 ? "s" : ""}</div>
                  </div>
                  <div style={{ fontSize: 14, fontWeight: 700, color: T.textMute }}>× {b.count}</div>
                </div>
              ))}
            </div>
          )}
          {remainder > 0 && (
            <div style={{ fontSize: 12, marginTop: 10, color: T.textFaint }}>
              {remainder}kg per side can't be made with standard plates (25/20/15/10/5/2.5/1.25kg).
            </div>
          )}
        </div>

        <div style={{ borderRadius: 10, padding: 12, textAlign: "center", backgroundColor: T.surface, border: `1px solid ${T.line}` }}>
          <div style={{ fontSize: 20, fontWeight: 900, color: T.accent }}>{achieved}</div>
          <div style={{ fontSize: 11, textTransform: "uppercase", color: T.textMute }}>Total kg loaded</div>
        </div>
      </div>
    </div>
  );
}

/* ROOT APP */
function App() {
  const [username, setUsername] = useState(() => loadUsername());
  const [equipment, setEquipment] = useState(() => loadEquipment());
  const [view, setView] = useState(() => (loadUsername() ? "home" : "onboarding-name"));
  const [activeDay, setActiveDay] = useState(null);
  const [activeExercises, setActiveExercises] = useState(null);
  const [sessions, setSessions] = useState(() => loadSessions());
  const [lastSession, setLastSession] = useState(null);

  const lastByDay = {};
  let totalKg = 0;
  sessions.forEach((s) => {
    if (!lastByDay[s.day] || new Date(s.date) > new Date(lastByDay[s.day])) lastByDay[s.day] = s.date;
    s.exercises.forEach((ex) => {
      ex.sets.forEach((row) => {
        const w = parseFloat(row.weight) || 0;
        const r = parseFloat(row.reps) || 0;
        totalKg += w * r;
      });
    });
  });
  const stats = { totalSessions: sessions.length, totalKg: Math.round(totalKg) };

  const handleNameSubmit = (name) => {
    setUsername(name);
    saveUsername(name);
    setView("onboarding-equipment");
  };

  const handleOnboardingEquipmentFinish = (selected) => {
    setEquipment(selected);
    saveEquipment(selected);
    setView("home");
  };

  const handleToggleEquipment = (id) => {
    setEquipment((prev) => {
      const next = prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id];
      saveEquipment(next);
      return next;
    });
  };

  const handleStart = (dayId) => {
    setActiveDay(dayId);
    setActiveExercises(buildDayExercises(dayId, equipment));
    setView("session");
  };

  const handleFinish = (dayId, exercises, log) => {
    const record = {
      id: Date.now().toString(),
      day: dayId,
      date: new Date().toISOString(),
      exercises: exercises.map((ex, i) => ({ name: ex.name, type: ex.type, sets: log[i] })),
    };
    const updated = [...sessions, record];
    setSessions(updated);
    saveSessions(updated);
    setLastSession(record);
    setView("summary");
  };

  const handleClear = () => {
    setSessions([]);
    saveSessions([]);
  };

  return (
    <div style={{ position: "relative", width: "100%", maxWidth: 480, margin: "0 auto", height: "100vh", overflow: "hidden" }}>
      <div style={{ display: "flex", flexDirection: "column", height: "100%", backgroundColor: "transparent", position: "relative" }}>
        {view === "onboarding-name" && (
          <NamePrompt onSubmit={handleNameSubmit} />
        )}
        {view === "onboarding-equipment" && (
          <EquipmentOnboarding initial={equipment} onFinish={handleOnboardingEquipmentFinish} />
        )}
        {view === "home" && (
          <Home
            onStart={handleStart}
            onHistory={() => setView("history")}
            onSettings={() => setView("settings")}
            onPlates={() => setView("plates")}
            lastByDay={lastByDay}
            stats={stats}
            name={username}
            equipment={equipment}
          />
        )}
        {view === "session" && activeExercises && (
          <Session dayId={activeDay} exercises={activeExercises} onFinish={handleFinish} onExit={() => setView("home")} />
        )}
        {view === "summary" && lastSession && (
          <Summary session={lastSession} onDone={() => setView("home")} />
        )}
        {view === "history" && (
          <HistoryView sessions={sessions} onBack={() => setView("home")} onClear={handleClear} />
        )}
        {view === "settings" && (
          <SettingsView equipment={equipment} onBack={() => setView("home")} onToggleEquipment={handleToggleEquipment} />
        )}
        {view === "plates" && (
          <PlateCalculator onBack={() => setView("home")} />
        )}
      </div>
      <div className="eldforge-grain" />
      <div className="eldforge-vignette" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
